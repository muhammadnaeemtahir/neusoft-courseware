<rect x="0" y="0" width="960" height="360" fill="#ffffff"/>
<text x="32" y="48" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">The four message roles and one tool call (providers/types.ts)</text>
<rect x="40" y="100" width="150" height="64" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="115.0" y="128.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#4c1d95" font-weight="bold">system</text>
<text x="115.0" y="149.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#8b5cf6">persona+rules, you write</text>
<rect x="220" y="100" width="140" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="290.0" y="128.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1e3a8a" font-weight="bold">user</text>
<text x="290.0" y="149.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#3b82f6">task input, from user</text>
<rect x="390" y="100" width="190" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
