<text x="485.0" y="149.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#3b82f6">parts: text + tool_call</text>
<rect x="610" y="100" width="170" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
