<text x="590" y="240" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#7c3aed">toolCallId "c1" pairs the assistant's intent with the tool result</text>
<rect x="40" y="268" width="860" height="56" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="470.0" y="290.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">Who writes each role: system = your program · user = the user · assistant = the model · tool = your program</text>
<text x="470.0" y="310.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">One assistant turn may carry text plus several tool_calls (parts array); each result is its own tool message</text>
<text x="32" y="344" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#94a3b8">opencode-lab · Module 01 · Message roles (5.2)</text>
