<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 710" width="960" height="710">
  <rect x="0" y="0" width="960" height="710" fill="#ffffff"/>
  <text x="32" y="48" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Pipe deadlock: three steps into mutual waiting</text>

  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- swimlane backdrops -->
  <rect x="48" y="70" width="372" height="520" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="234" y="94" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="bold" fill="#334155">Parent process (your CLI code)</text>
  <rect x="550" y="70" width="370" height="520" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="735" y="94" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="bold" fill="#334155">Child process (bun run subcommand)</text>

  <!-- step ① -->
  <rect x="70" y="120" width="330" height="68" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="235" y="148" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">① spawn child process</text>
  <text x="235" y="170" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#3b82f6">child starts producing output</text>

  <line x1="400" y1="154" x2="566" y2="154" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="483" y="146" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">spawn</text>

  <rect x="570" y="120" width="330" height="68" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="735" y="148" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">child writes stdout</text>
  <text x="735" y="170" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#3b82f6">pipe buffer fills up (64KB)</text>

  <line x1="235" y1="188" x2="235" y2="246" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <line x1="735" y1="188" x2="735" y2="246" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- step ② -->
  <rect x="70" y="250" width="330" height="80" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="235" y="282" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" font-weight="bold" fill="#78350f">② await proc.exited</text>
  <text x="235" y="306" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#b45309">suspended until the child exits</text>

  <rect x="570" y="250" width="330" height="80" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="735" y="282" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" font-weight="bold" fill="#334155">stdout pipe is full</text>
  <text x="735" y="306" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#64748b">child keeps writing, but nothing gets through</text>

  <line x1="735" y1="330" x2="735" y2="426" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- step ③ -->
  <rect x="570" y="430" width="330" height="90" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="735" y="462" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" font-weight="bold" fill="#7f1d1d">③ write is suspended by the OS</text>
  <text x="735" y="488" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#dc2626">pipe full → write blocked → never exits</text>

  <!-- mutual wait forms a cycle -->
  <polyline points="400,295 430,295 430,470 566,470" fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="490" y="462" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#b45309">waits for child exit</text>

  <polyline points="570,495 540,495 540,320 404,320" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="485" y="312" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#dc2626">waits for pipe room</text>

  <rect x="447" y="378" width="76" height="34" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="485" y="401" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" font-weight="bold" fill="#dc2626">deadlock</text>

  <!-- fix -->
  <rect x="250" y="614" width="460" height="58" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="480" y="638" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" font-weight="bold" fill="#14532d">Fix: Promise.all(read output, await exit)</text>
  <text x="480" y="660" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#16a34a">reading and awaiting run concurrently — the pipe never clogs</text>

  <text x="32" y="694" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#94a3b8">opencode-lab · Module 00 · Pipe deadlock (2.2.2)</text>
</svg>
