<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" width="920" height="680">
  <rect x="0" y="0" width="920" height="680" fill="#ffffff"/>
  <text x="32" y="48" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Two-stream split: stdout is the output protocol, stderr is JSON Lines logging</text>

  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- one run -->
  <rect x="360" y="76" width="200" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="460" y="101" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#1e3a8a">One CLI run</text>
  <text x="460" y="122" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#3b82f6">src/cli/main.ts</text>

  <!-- split -->
  <line x1="460" y1="136" x2="460" y2="158" stroke="#475569" stroke-width="1.5"/>
  <line x1="180" y1="158" x2="650" y2="158" stroke="#475569" stroke-width="1.5"/>
  <line x1="180" y1="158" x2="180" y2="184" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <line x1="650" y1="158" x2="650" y2="184" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- stdout channel -->
  <rect x="90" y="190" width="180" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="180" y="215" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#1e3a8a">stdout</text>
  <text x="180" y="236" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#3b82f6">output protocol channel</text>

  <!-- stderr channel -->
  <rect x="560" y="190" width="180" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="650" y="215" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#1e3a8a">stderr</text>
  <text x="650" y="236" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#3b82f6">diagnostics channel</text>

  <!-- left: output protocol -->
  <line x1="180" y1="250" x2="180" y2="284" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <rect x="60" y="290" width="240" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="180" y="317" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#1e3a8a">text or one JSON line</text>
  <text x="180" y="338" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#3b82f6">run --json output protocol</text>

  <line x1="180" y1="354" x2="180" y2="394" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <rect x="60" y="400" width="240" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="180" y="425" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#7f1d1d">no logs allowed here</text>
  <text x="180" y="446" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#ef4444">one log line breaks parsing</text>

  <line x1="180" y1="460" x2="180" y2="494" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <rect x="60" y="500" width="240" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="180" y="525" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#14532d">downstream stays parseable</text>
  <text x="180" y="546" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#22c55e">jq / shell scripts / tests</text>

  <!-- right: the logging path -->
  <line x1="650" y1="250" x2="650" y2="278" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <rect x="530" y="284" width="240" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="650" y="309" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#78350f">redactFields redaction</text>
  <text x="650" y="330" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#f59e0b">secret-like field name → [REDACTED]</text>

  <line x1="650" y1="344" x2="650" y2="384" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <rect x="520" y="390" width="260" height="64" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="650" y="417" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#4c1d95">JSON Lines log</text>
  <text x="650" y="438" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#8b5cf6">ts / level / runId / message</text>

  <line x1="650" y1="454" x2="650" y2="494" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <rect x="520" y="500" width="260" height="60" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="650" y="525" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#334155">2&gt;log.txt / log collection</text>
  <text x="650" y="546" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#64748b">replay a run from its runId</text>

  <!-- bottom testing note -->
  <rect x="60" y="590" width="720" height="50" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="420" y="620" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#334155">Integration tests assert: --json stdout is exactly one parseable line; --verbose logs only reach stderr</text>

  <text x="32" y="664" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#94a3b8">opencode-lab · src/core/logger.ts · src/cli/main.ts · Figure 0-2</text>
</svg>
