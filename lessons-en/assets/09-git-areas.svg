<line x1="260" y1="126" x2="324" y2="126" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
<text x="292" y="114" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748b">git add</text>
<line x1="530" y1="126" x2="594" y2="126" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
<text x="562" y="114" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748b">git commit</text>
<line x1="594" y1="156" x2="534" y2="156" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
<text x="562" y="198" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748b">git reset (moves pointer)</text>
<line x1="324" y1="158" x2="264" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
<text x="292" y="198" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748b">git checkout -- file</text>
<rect x="60" y="220" width="740" height="84" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="430.0" y="246.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">Snapshots here never touch index or branches: createSnapshot uses git stash push (untracked files included)</text>
<text x="430.0" y="266.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">snapshotRestore uses git checkout &lt;stash&gt; -- . (never reset --hard); the stash only grows, user drops entries</text>
<text x="430.0" y="286.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">The baseline stores baselineStatus (user edits) — that's how a diff separates user changes from Agent changes</text>
<text x="32" y="344" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#94a3b8">opencode-lab · Module 09 · Git areas (5.1)</text>
