<rect x="0" y="0" width="860" height="360" fill="#ffffff"/>
<text x="32" y="48" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Git's three areas &amp; this project's snapshot usage (src/git/snapshot.ts)</text>
