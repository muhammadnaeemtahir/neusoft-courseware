<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
<defs>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
</defs>
<rect x="0" y="0" width="960" height="380" fill="#ffffff"/>
<text x="32" y="48" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Two API styles: full messages vs stateful previous_response_id</text>
<rect x="60" y="90" width="400" height="180" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="76" y="114" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#1e3a8a">POST /v1/chat/completions</text>
<text x="76" y="134" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#1e3a8a">{</text>
<text x="76" y="154" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#1e3a8a">  "model": "glm-4.6",</text>
<text x="76" y="174" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#1e3a8a">  "messages": [</text>
<text x="76" y="194" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#1e3a8a">    {"role":"system", …},</text>
<text x="76" y="214" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#1e3a8a">    {"role":"user", …},</text>
<text x="76" y="234" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#1e3a8a">    {"role":"assistant", …},</text>
<text x="76" y="254" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#1e3a8a">    {"role":"tool", …}</text>
<text x="76" y="274" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#1e3a8a">  ],</text>
<text x="76" y="294" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#1e3a8a">  "stream": true</text>
<text x="76" y="314" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#1e3a8a">}</text>
<rect x="520" y="90" width="400" height="180" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="536" y="114" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#4c1d95">POST /v1/responses</text>
<text x="536" y="134" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#4c1d95">{</text>
<text x="536" y="154" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#4c1d95">  "model": "…",</text>
<text x="536" y="174" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#4c1d95">  "input": "this turn only",</text>
<text x="536" y="194" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#4c1d95">  "previous_response_id": "resp_123"</text>
<text x="536" y="214" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#4c1d95">}</text>
<text x="536" y="234" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#4c1d95"></text>
<text x="536" y="254" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#4c1d95"># history lives server-side; send the delta</text>
<text x="260" y="296" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1e3a8a" font-weight="bold">Resend full history each turn — server is stateless</text>
<text x="720" y="296" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4c1d95" font-weight="bold">History lives server-side — client holds the handle</text>
<rect x="60" y="316" width="800" height="44" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="460.0" y="342.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">Chosen here: full messages — vendor-neutral, predictable; a crash rebuilds the request from SQLite (openai-compatible.ts)</text>
<text x="32" y="364" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#94a3b8">opencode-lab · Module 01 · API styles (5.1)</text>
</svg>
