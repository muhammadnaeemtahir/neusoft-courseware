</defs>
<rect x="0" y="0" width="860" height="440" fill="#ffffff"/>
<text x="32" y="48" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Agent Loop's four terminal states and exits (RunStatus, src/agent/loop.ts)</text>
<rect x="320" y="180" width="220" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="430.0" y="219.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1e3a8a" font-weight="bold">Agent Loop</text>
<text x="430.0" y="238.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#3b82f6">while (turns &lt; maxSteps)</text>
<text x="430.0" y="253.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#3b82f6">each turn: model → tools → feed back</text>
<rect x="620" y="90" width="200" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="720.0" y="118.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#14532d" font-weight="bold">completed</text>
<text x="720.0" y="139.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#22c55e">no tool_calls → finalText</text>
<rect x="620" y="300" width="200" height="64" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="720.0" y="328.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#334155" font-weight="bold">max_steps</text>
<text x="720.0" y="349.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#64748b">step cap reached, forced close</text>
<rect x="60" y="90" width="200" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="160.0" y="118.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#7f1d1d" font-weight="bold">aborted</text>
<text x="160.0" y="139.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#ef4444">signal.aborted, user cancelled</text>
<rect x="60" y="300" width="200" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="160.0" y="328.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#7f1d1d" font-weight="bold">failed</text>
<text x="160.0" y="349.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#ef4444">provider error survived retries</text>
<line x1="540" y1="200" x2="614" y2="140" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="560" y="158" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748b">no tool calls</text>
<line x1="540" y1="250" x2="614" y2="320" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
<text x="560" y="300" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748b">turns used up</text>
<line x1="320" y1="200" x2="266" y2="140" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
<text x="128" y="176" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748b">checkpoint sees abort</text>
<line x1="320" y1="250" x2="266" y2="320" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
<text x="128" y="296" text-anchor="start" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748b">error passthrough (unretryable)</text>
<rect x="60" y="378" width="740" height="56" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="430.0" y="400.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">The four states are RunStatus: completed | failed | aborted | max_steps — recovery branches on them</text>
<text x="430.0" y="420.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">Exhausting the token budget is not terminal — module 08 compaction / degrade takes over, loop continues</text>
<text x="32" y="424" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#94a3b8">opencode-lab · Module 04 · Stop conditions (5.5)</text>
</svg>
