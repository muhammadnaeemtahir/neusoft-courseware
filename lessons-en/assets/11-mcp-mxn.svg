<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <rect x="0" y="0" width="960" height="480" fill="#ffffff"/>
  <text x="32" y="48" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="bold" fill="#0f172a">What MCP solves: integration cost drops from M×N to M+N</text>

  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- left panel: the problem -->
  <rect x="32" y="80" width="384" height="300" rx="10" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="224" y="106" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" font-weight="bold" fill="#991b1b">Problem: M×N bespoke glue paths</text>

  <!-- application column (blue) -->
  <rect x="56" y="126" width="120" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="116" y="151" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#1e3a8a">Claude</text>
  <rect x="56" y="186" width="120" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="116" y="211" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#1e3a8a">Cursor</text>
  <rect x="56" y="246" width="120" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="116" y="271" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#1e3a8a">Your CLI</text>

  <!-- tool column (green) -->
  <rect x="272" y="126" width="120" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="332" y="151" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#14532d">GitHub</text>
  <rect x="272" y="186" width="120" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="332" y="211" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#14532d">Database</text>
  <rect x="272" y="246" width="120" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="332" y="271" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#14532d">Filesystem</text>

  <!-- 9 pairwise lines (red tones, dense) -->
  <g stroke="#dc2626" stroke-width="1.2" opacity="0.45">
    <line x1="176" y1="146" x2="272" y2="146"/><line x1="176" y1="146" x2="272" y2="206"/><line x1="176" y1="146" x2="272" y2="266"/>
    <line x1="176" y1="206" x2="272" y2="146"/><line x1="176" y1="206" x2="272" y2="206"/><line x1="176" y1="206" x2="272" y2="266"/>
    <line x1="176" y1="266" x2="272" y2="146"/><line x1="176" y1="266" x2="272" y2="206"/><line x1="176" y1="266" x2="272" y2="266"/>
  </g>
  <rect x="186" y="182" width="76" height="20" fill="#ffffff"/>
  <text x="224" y="196" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">3×3 = 9</text>

  <text x="224" y="330" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="bold" fill="#991b1b">Each written and maintained separately</text>
  <text x="224" y="354" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">any change on either side means rework</text>

  <!-- the big arrow in the middle -->
  <text x="480" y="200" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Adopt MCP</text>
  <line x1="428" y1="230" x2="528" y2="230" stroke="#475569" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <text x="480" y="258" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">one protocol + discovery</text>

  <!-- right panel: the solution -->
  <rect x="544" y="80" width="384" height="300" rx="10" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="736" y="106" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" font-weight="bold" fill="#14532d">Solution: M+N standard adapters</text>

  <!-- application column (blue) -->
  <rect x="564" y="126" width="104" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="616" y="151" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#1e3a8a">Claude</text>
  <rect x="564" y="186" width="104" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="616" y="211" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#1e3a8a">Cursor</text>
  <rect x="564" y="246" width="104" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="616" y="271" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#1e3a8a">Your CLI</text>

  <!-- the MCP standard box (purple) -->
  <rect x="692" y="136" width="104" height="140" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="744" y="192" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" font-weight="bold" fill="#4c1d95">MCP</text>
  <text x="744" y="214" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#7c3aed">shared protocol</text>
  <text x="744" y="236" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#8b5cf6">client ↔ server</text>

  <!-- tool column (green) -->
  <rect x="820" y="126" width="100" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="870" y="151" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#14532d">GitHub</text>
  <rect x="820" y="186" width="100" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="870" y="211" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#14532d">Database</text>
  <rect x="820" y="246" width="100" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="870" y="271" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#14532d">Filesystem</text>

  <!-- 6 lines: apps→MCP (blue) -->
  <g stroke="#2563eb" stroke-width="1.5">
    <line x1="668" y1="146" x2="690" y2="146"/>
    <line x1="668" y1="206" x2="690" y2="206"/>
    <line x1="668" y1="266" x2="690" y2="266"/>
  </g>
  <!-- MCP→tools (green) -->
  <g stroke="#16a34a" stroke-width="1.5">
    <line x1="796" y1="146" x2="818" y2="146"/>
    <line x1="796" y1="206" x2="818" y2="206"/>
    <line x1="796" y1="266" x2="818" y2="266"/>
  </g>

  <text x="736" y="330" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="bold" fill="#14532d">3 + 3 = 6: 3 clients + 3 servers</text>
  <text x="736" y="354" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#16a34a">new apps or tools plug in with zero glue</text>

  <!-- bottom comparison bar -->
  <rect x="32" y="404" width="896" height="40" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="480" y="429" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#334155">Quick math: 5 apps × 8 services = 40 integrations → 5 + 8 = 13 — the more services, the wider the gap</text>

  <text x="32" y="466" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#94a3b8">opencode-lab · Module 11 · Foundations · MCP's M×N → M+N (2.2.1)</text>
</svg>
