<text x="430.0" y="352.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">Three channels, three jobs: stdout carries results, stderr diagnostics, exitCode is the machine verdict</text>
<text x="430.0" y="372.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">outcome = { exitCode, stdout, stderr, timedOut } — on timeout ok=false with 'command timed out, killed'</text>
