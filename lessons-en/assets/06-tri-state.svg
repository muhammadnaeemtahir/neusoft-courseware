<rect x="330" y="302" width="250" height="50" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="455.0" y="323.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155" font-weight="bold">③ Path boundary</text>
<text x="455.0" y="344.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#64748b">resolve + realpath outside workspace</text>
<rect x="660" y="302" width="170" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="745.0" y="332.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#7f1d1d" font-weight="bold">deny</text>
<line x1="580" y1="315" x2="654" y2="315" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
<rect x="330" y="368" width="250" height="50" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="455.0" y="389.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155" font-weight="bold">④ Explicit config mode</text>
<text x="455.0" y="410.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#64748b">config: deny / ask / allow</text>
<rect x="660" y="368" width="170" height="50" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="745.0" y="389.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#78350f" font-weight="bold">deny·ask·allow</text>
<text x="745.0" y="410.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#f59e0b">first match wins</text>
<line x1="580" y1="381" x2="654" y2="381" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
<rect x="330" y="434" width="250" height="50" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="455.0" y="455.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155" font-weight="bold">⑤ Risk default</text>
<text x="455.0" y="476.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#64748b">low → allow; medium/high → ask</text>
<rect x="660" y="434" width="170" height="50" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="745.0" y="455.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#78350f" font-weight="bold">allow / ask</text>
<text x="745.0" y="476.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#f59e0b">fallback</text>
<line x1="580" y1="447" x2="654" y2="447" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
<line x1="455" y1="220" x2="455" y2="236" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
<text x="470" y="236" text-anchor="start" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748b">no hit</text>
