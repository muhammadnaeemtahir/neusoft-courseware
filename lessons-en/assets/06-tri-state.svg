<rect x="0" y="0" width="860" height="590" fill="#ffffff"/>
<text x="32" y="48" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Permission decision flow: deny wins, allow can't override (src/permission/evaluate.ts)</text>
<rect x="330" y="80" width="250" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="455.0" y="101.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1e3a8a" font-weight="bold">Tool call request</text>
<text x="455.0" y="122.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#3b82f6">tool + input + agent</text>
<line x1="455" y1="130" x2="455" y2="162" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
<text x="60" y="100" text-anchor="start" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155" font-weight="bold">Three states: allow · ask a human · deny</text>
<text x="60" y="122" text-anchor="start" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748b">①②③ are hard gates — a hit means deny,</text>
<text x="60" y="140" text-anchor="start" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748b">and no amount of config allow overrides them</text>
<rect x="330" y="170" width="250" height="50" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="455.0" y="191.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155" font-weight="bold">① Dangerous-command floor</text>
<text x="455.0" y="212.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#64748b">rm -rf / sudo hardcoded patterns</text>
<rect x="660" y="170" width="170" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="745.0" y="191.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#7f1d1d" font-weight="bold">deny</text>
<text x="745.0" y="212.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#ef4444">no config can loosen</text>
<line x1="580" y1="183" x2="654" y2="183" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
<rect x="330" y="236" width="250" height="50" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="455.0" y="257.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155" font-weight="bold">② Read-only role check</text>
<text x="455.0" y="278.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#64748b">plan/explore calling non-low risk</text>
<rect x="660" y="236" width="170" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="745.0" y="266.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#7f1d1d" font-weight="bold">deny</text>
