<text x="470" y="302" text-anchor="start" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748b">no hit</text>
<line x1="455" y1="352" x2="455" y2="368" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
<text x="470" y="368" text-anchor="start" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748b">no hit</text>
<line x1="455" y1="418" x2="455" y2="434" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
<text x="470" y="434" text-anchor="start" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748b">no hit</text>
<rect x="60" y="510" width="740" height="56" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="430.0" y="532.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">ask uses the askHandler channel: allow once / this session / save to config forever; declining is deny</text>
<text x="430.0" y="552.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">Order is priority — evaluate.ts's five steps stop at first match; deny always wins</text>
<text x="32" y="574" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#94a3b8">opencode-lab · Module 06 · Tri-state decisions (5.2 / 5.7)</text>
</svg>
