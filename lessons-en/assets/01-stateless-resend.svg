<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560">
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
  <text x="32" y="48" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Stateless API: history is the client's responsibility</text>

  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- server -->
  <rect x="60" y="140" width="200" height="300" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="160" y="176" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="bold" fill="#4c1d95">Server (LLM API)</text>
  <text x="160" y="200" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#8b5cf6">Stores no conversation history</text>
  <rect x="95" y="224" width="130" height="32" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="160" y="245" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#78350f">Stateless</text>
  <text x="160" y="296" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#64748b">Generates a reply from the</text>
  <text x="160" y="316" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#64748b">messages in this request</text>

  <!-- client -->
  <rect x="700" y="140" width="200" height="300" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="800" y="176" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">Client (your program)</text>
  <text x="800" y="200" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#3b82f6">Keeper of the messages history</text>
  <rect x="735" y="224" width="130" height="32" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="800" y="245" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#14532d">Saves the entire history</text>
  <text x="800" y="296" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#64748b">Every turn resends the full</text>
  <text x="800" y="316" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#64748b">history from the first message</text>

  <!-- turn 1 -->
  <line x1="698" y1="172" x2="664" y2="172" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <rect x="480" y="140" width="180" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="570" y="166" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">Turn 1</text>
  <text x="570" y="188" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#3b82f6">[user]</text>
  <line x1="476" y1="164" x2="264" y2="164" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <line x1="264" y1="182" x2="476" y2="182" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>
  <text x="370" y="202" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#16a34a">assistant reply</text>

  <!-- turn 2 -->
  <line x1="698" y1="290" x2="664" y2="290" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <rect x="410" y="258" width="250" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="535" y="284" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">Turn 2</text>
  <text x="535" y="306" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#3b82f6">[user, assistant, user]</text>
  <line x1="406" y1="282" x2="264" y2="282" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="335" y="272" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#b45309">Resends all history</text>
  <line x1="264" y1="300" x2="406" y2="300" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>
  <text x="335" y="320" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#16a34a">assistant reply</text>

  <!-- turn 3 -->
  <line x1="698" y1="408" x2="664" y2="408" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <rect x="330" y="376" width="330" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="495" y="402" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">Turn 3</text>
  <text x="495" y="424" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#3b82f6">[user, assistant, user, assistant, user]</text>
  <line x1="326" y1="400" x2="264" y2="400" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="295" y="392" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#b45309">Sent again</text>
  <line x1="264" y1="418" x2="326" y2="418" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>

  <!-- bottom takeaway -->
  <rect x="60" y="470" width="840" height="44" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="480" y="497" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#334155">The server has no memory: each turn must resend the complete messages from the very first one — history is the client's responsibility</text>

  <text x="32" y="544" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#94a3b8">opencode-lab · Module 01 · Stateless API (2.2.1)</text>
</svg>
