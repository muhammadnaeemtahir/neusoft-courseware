<text x="745" y="190" text-anchor="end" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748b">[REDACTED]</text>
<rect x="130" y="230" width="330" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="295.0" y="258.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#7f1d1d" font-weight="bold">Anti-pattern: secret in config</text>
<text x="295.0" y="279.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#ef4444">→ lives in Git history forever</text>
<text x="430" y="330" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748b">Redact regex: /(^|[-_])(api[-_]?key|token|secret|authorization|password)$/i — key-like fields get masked</text>
<text x="32" y="334" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#94a3b8">opencode-lab · Module 05 · Secret management (5.6)</text>
