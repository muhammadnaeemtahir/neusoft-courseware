<text x="375.0" y="149.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#8b5cf6">apiKeyEnv — file is shareable</text>
<rect x="520" y="100" width="140" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="590.0" y="128.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1e3a8a" font-weight="bold">Resolved at runtime</text>
<text x="590.0" y="149.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#3b82f6">process.env[name]</text>
