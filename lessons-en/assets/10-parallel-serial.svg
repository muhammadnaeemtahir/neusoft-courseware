<text x="430.0" y="372.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">Parallel requires independent subtasks (read-only investigations); the teaching loop awaits a turn's tool_calls in order</text>
