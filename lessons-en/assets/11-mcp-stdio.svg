<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400">
<defs>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
</defs>
<rect x="0" y="0" width="860" height="400" fill="#ffffff"/>
<text x="32" y="48" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">MCP stdio transport: two pipes + one log channel (src/extensions/mcp.ts)</text>
<rect x="60" y="110" width="220" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="170.0" y="146.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1e3a8a" font-weight="bold">opencode-lab</text>
<text x="170.0" y="167.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#3b82f6">MCP client (host)</text>
<rect x="560" y="110" width="240" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="680.0" y="146.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1e3a8a" font-weight="bold">MCP Server child process</text>
<text x="680.0" y="167.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#3b82f6">launched via Bun.spawn(cmd)</text>
<line x1="280" y1="128" x2="554" y2="128" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="417" y="116" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748b">stdin: JSON-RPC requests (id increments)</text>
<line x1="554" y1="158" x2="286" y2="158" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="417" y="146" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748b">stdout: JSON-RPC responses / notifications</text>
<line x1="554" y1="178" x2="286" y2="178" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)" stroke-dasharray="5 3"/>
<text x="417" y="198" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748b">stderr: log channel (never used as protocol)</text>
<rect x="60" y="240" width="740" height="96" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="430.0" y="272.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">Lifecycle: spawn → initialize handshake → notifications/initialized (no reply) → tools/list → tools/call … → kill</text>
<text x="430.0" y="292.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">Every request has a 15s timeout; when the server exits, failAll rejects all pending requests — nothing hangs in silence</text>
<text x="430.0" y="312.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">stdio over network ports: zero config, no port conflicts, the connection dies with the process (bound lifecycles)</text>
<text x="32" y="384" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#94a3b8">opencode-lab · Module 11 · stdio transport (5.4)</text>
</svg>
