<text x="430.0" y="340.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">diff: git diff c1..c2 compares two snapshots; working-tree edits use git diff (unstaged) and git diff --staged</text>
<text x="430.0" y="360.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">Rollback pair: revert adds an inverse commit (history advances, safe after push); reset moves the branch pointer</text>
<text x="430.0" y="380.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155">A branch is just a movable pointer to a commit — branching is zero-copy; only merge creates a merge commit</text>
